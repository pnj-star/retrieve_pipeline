name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install pytest prometheus-client pyjwt

      - name: Install common_core (shared runtime dependency)
        run: |
          if [ -d ../common_core ]; then
            python -m pip install -e "../common_core[llm,vector,cache,mcp,test]"
          else
            python -m pip install "common-core[llm,vector,cache,mcp,test]~=0.1.0"
          fi

      - name: Install package (editable, runtime deps only)
        run: python -m pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest
