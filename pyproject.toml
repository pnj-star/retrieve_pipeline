[project]
name = "rag-skill"
version = "0.1.0"
description = "Reusable RAG pipeline skill built on common_core providers."
requires-python = ">=3.11"
dependencies = [
  "common-core[llm,vector,cache]>=0.1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
test = ["pytest>=8.0"]

[project.scripts]
rag-skill-mcp = "rag_skill.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_skill"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
